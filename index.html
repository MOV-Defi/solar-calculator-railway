<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SES V3.5</title>
    <link id="main-style" rel="stylesheet" href="./style.css?v=20260424">
    <script>
      // Примусова очистка кешу та Service Workers
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('SW unregistered');
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) caches.delete(name);
        });
      }
      
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var div = document.createElement('div');
        div.style.position = 'fixed'; div.style.top = '0'; div.style.left = '0';
        div.style.width = '100%'; div.style.background = 'red'; div.style.color = 'white';
        div.style.padding = '20px'; div.style.zIndex = '9999';
        div.innerHTML = '<b>Критична помилка:</b> ' + msg + '<br>Файл: ' + url + ' (ряд. ' + lineNo + ')';
        document.body.appendChild(div);
        return false;
      };
    </script>
    <script>
      (function () {
        var link = document.getElementById('main-style');
        if (!link) return;

        link.onerror = function () {
          if (!link.dataset.retry1) {
            link.dataset.retry1 = '1';
            link.href = 'style.css?v=20260424';
            return;
          }
          if (!link.dataset.retry2) {
            link.dataset.retry2 = '1';
            link.href = '/style.css?v=20260424';
          }
        };

        // Windows-safe fallback: fetch CSS and inject as <style>
        (async function injectCssFallback() {
          var urls = ['/style.css?v=20260424', './style.css?v=20260424', 'style.css?v=20260424'];
          for (var i = 0; i < urls.length; i += 1) {
            try {
              var res = await fetch(urls[i], { cache: 'no-store' });
              if (!res.ok) continue;
              var css = await res.text();
              if (!css || css.indexOf('--bg-color') === -1) continue;
              if (!document.getElementById('main-style-inline-fallback')) {
                var styleTag = document.createElement('style');
                styleTag.id = 'main-style-inline-fallback';
                styleTag.textContent = css;
                document.head.appendChild(styleTag);
              }
              break;
            } catch (e) {}
          }
        })();
      })();
    </script>
    <!-- React and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="./babel.min.js"></script>

    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    
    <!-- Helper Scripts (loaded before app.js) -->
    <script type="text/babel" src="constants.js"></script>
    <script type="text/babel" src="fileSystem.js"></script>
    <script type="text/babel" src="exportExcel.js"></script>
    <script type="text/babel" src="exportPdf.js"></script>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
</head>
<body class="bg-gray-900 text-white font-sans">
    <div id="root">
      <div id="boot-status" style="padding:16px;text-align:center;color:#94a3b8;font-family:system-ui,sans-serif;">
        Завантаження калькулятора...
      </div>
    </div>
    <script type="text/babel" src="app.js?v=3.5"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        var hasRendered = root && root.children && root.children.length > 0 && !document.getElementById('boot-status');
        if (!hasRendered) {
          var status = document.getElementById('boot-status');
          if (status) {
            status.style.color = '#fca5a5';
            status.innerHTML = 'Не вдалося завантажити інтерфейс. Оновіть сторінку (Ctrl+F5) або перевірте консоль браузера.';
          }
        }
      }, 4500);
    </script>

          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('Service Worker registration failed: ', err);
          });
        });
      }
      */
    </script>
</body>
